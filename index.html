<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./css/stylesheet.css" />
    <title>SpyDB</title>
  </head>
  <body>
    <div id="ribbon"></div>
    <div id="main">
      <table id="sheet" class="wikitable">
        <colgroup id="colgroup"></colgroup>
      </table>
    </div>
  </body>
  <script type="importmap">
    {
      "imports": {
        "@me/": "./js/@me/"
      }
    }
  </script>

  <script type="module">
    window.resolve = (moduleID) => import.meta.resolve(moduleID);
    window.updateCSS = () => {
      document.querySelector("link").href = "./css/stylesheet.css?a=" + String(Math.random()).slice(2);
    }
  </script>
  <script src="./js/3rd/read-excel-file.min.js"></script>

  <script>
    // === Functions === //

    function blink(callback, dt = 1000) {
      return setInterval(callback, dt);
    }

    async function fetchWikipediaSummary (title) {
      return await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`).then(r => r.json())
    }

    function setRegionalPrefix (element, ...regions) {
      element.classList.add("has-regional-prefix");
      element.style.setProperty("--regions", `"${regions.join("\u00A0")}"`)
    }

    function setRegionalSuffix (element, ...regions) {
      element.classList.add("has-regional-suffix");
      element.style.setProperty("--regions", `"${regions.join("\u00A0")}"`)
    }

    function unsetRegionalPrefix (element, ...regions) {
      element.classList.remove("has-regional-prefix");
    }

    function unsetRegionalSuffix (element, ...regions) {
      element.classList.remove("has-regional-suffix");
    }

    ;(async () => {
      /* Asynchronous imports */
      window.dom = await import("@me/dom.js")
      window.utils = await import("@me/utils.js")
      window.Game = await utils.importModule("@me/Game.js")
      window.Region = await utils.importModule("@me/Region.js")
      window.Region.load()
      window.ReferenceTooltip = await utils.importModule("@me/ReferenceTooltip.js")
      window.UI = await utils.importModule("@me/UI.js")
      window.ui = new UI()
      /* Additional globals for convenience */
      Object.assign(window, { regions: Region.instances }, utils)
      /* Ribbon initialization */
      dom.ribbon.append(
        ui.filePicker,
        ui.spCounter,
        ...regions.map(r => r.label),
        ui.btnRegionALL,
        ui.btnRegionNONE,
        ui.seConsole,
        ui.lblUseEmojiFlags,
        ui.lblAlignCenter,
        ui.lblUseCompactMode,
        ui.lblUseRegionalPrefixes,
        ui.btnUnload,
      )
    })();
  </script>
</html>
